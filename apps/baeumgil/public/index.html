<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움길</title>
  <link rel="icon" type="image/png" href="./assets/brand/baeumgil-logo.png?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/katex/katex.min.js"></script>
  <link rel="stylesheet" href="roadmap.css">
  <link rel="stylesheet" href="overview.css">
  <link rel="stylesheet" href="sidenav.css">
  <link rel="stylesheet" href="guardian.css">
  <link rel="stylesheet" href="meeko-theme.css">
  <link rel="stylesheet" href="accessibility.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="topbar">
    <button id="nav-menu" class="nav-menu ghost small" aria-controls="sidenav" aria-expanded="false" aria-label="메뉴 열기" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand">
      <img class="logo" src="./assets/brand/baeumgil-logo.png?v=2" alt="" width="64" height="56">
      배움길 <span class="muted">학생의 배움을 잇고, 멘토의 부담을 덜다</span>
    </div>
    <button id="large-text" class="ghost small" aria-pressed="false">큰글씨</button>
    <span id="display-status" class="sr-only" role="status"></span>
    <div id="session-controls" class="session-controls" hidden>
      <span id="current-profile" class="current-profile"></span>
      <button id="change-subject" class="ghost small" hidden>과목 선택</button>
      <button id="change-role" class="ghost small">로그아웃</button>
    </div>
    <button id="reset" class="ghost small" hidden>시연 초기화</button>
  </header>
  <p id="demo-note" class="demo-note" role="note" hidden><span id="save-note"></span> <span id="entry-session-note" hidden>로그인 상태를 저장할 수 없어 새로고침하면 다시 로그인해야 할 수 있어요.</span></p>
  <div id="shell" class="shell">
    <aside id="sidenav" class="sidenav" aria-label="주 메뉴" hidden>
      <div class="sidenav-head"><span class="sidenav-title">메뉴</span><button id="sidenav-toggle" class="sidenav-toggle" aria-controls="sidenav" aria-expanded="true" aria-label="메뉴 접기" title="메뉴 접기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button></div>
      <nav id="learner-navigation" class="sidenav-nav" aria-label="멘티 메뉴" hidden>
        <p class="sidenav-group">학습</p>
        <button id="learner-learning" class="sidenav-item" title="나의 학습" ><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg><span class="sidenav-label">나의 학습</span></button>
        <button id="learner-roadmap" class="sidenav-item" title="로드맵" ><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg><span class="sidenav-label">로드맵</span></button>
      </nav>
      <nav id="guardian-navigation" class="sidenav-nav" aria-label="보호자 메뉴" hidden><p class="sidenav-group">함께 응원하기</p><span class="sidenav-item" aria-current="page">학습 소식</span></nav>
      <nav id="mentor-navigation" class="sidenav-nav" aria-label="멘토 메뉴" hidden>
        <p class="sidenav-group">학생</p>
        <button id="mentor-nav-home" class="sidenav-item" title="멘토 홈" data-nav-tab="home"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="sidenav-label">멘토 홈</span></button>
        <button id="mentor-nav-roadmap" class="sidenav-item" title="로드맵" data-nav-tab="roadmap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg><span class="sidenav-label">로드맵</span></button>
        <button id="mentor-nav-learning" class="sidenav-item" title="학습 기록" data-nav-tab="learning"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="sidenav-label">학습 기록</span></button>
        <p class="sidenav-group">수업</p>
        <button id="mentor-nav-planning" class="sidenav-item" title="수업 준비" data-nav-tab="planning"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4M9 11h6M9 15h4"/></svg><span class="sidenav-label">수업 준비</span></button>
        <button id="mentor-nav-sessions" class="sidenav-item" title="회기·일지" data-nav-tab="sessions"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span class="sidenav-label">회기·일지</span></button>
      </nav>
    </aside>
    <div id="sidenav-scrim" class="sidenav-scrim" hidden></div>
    <main id="app" tabindex="-1"><p class="muted">불러오는 중…</p></main>
  </div>
  <dialog id="image-viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title">원본 문항 크게 보기</h2><button id="viewer-size" aria-pressed="false">더 크게</button><button id="viewer-close" autofocus>닫기</button></div><p class="muted small">더 크게 보기를 켜면 이미지를 상하·좌우로 이동하며 볼 수 있어요.</p><div class="viewer-scroll" tabindex="0" aria-label="확대한 문항 이미지"><img id="viewer-image" alt=""></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
