<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움길</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#0d9488"/>
        <path d="M7 22c4-1 6-5 9-9s5-5 9-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="7" cy="22" r="2.6" fill="#fde68a"/><circle cx="25" cy="8" r="2.6" fill="#fff"/>
      </svg>
      배움길 <span class="muted">학생의 배움을 잇고, 멘토의 부담을 덜다</span>
    </div>
    <nav class="roles" aria-label="역할 전환">
      <button data-role="mentor" aria-pressed="false">멘토</button>
      <button data-role="learner" aria-pressed="false">멘티</button>
    </nav>
    <button id="reset" class="ghost small">시연 초기화</button>
  </header>
  <p class="demo-note" role="note">시연용 화면이에요. 가명 데이터를 쓰고, 역할 전환은 보안 기능이 아니에요. <span id="save-note"></span></p>
  <main id="app" tabindex="-1"><p class="muted">불러오는 중…</p></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
