<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움길</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./styles.css">

<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#0d9488"/>
        <path d="M7 22c4-1 6-5 9-9s5-5 9-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="7" cy="22" r="2.6" fill="#fde68a"/><circle cx="25" cy="8" r="2.6" fill="#fff"/>

      배움길 <span class="muted">학생의 배움을 잇고, 멘토의 부담을 덜다</span>
    </div>
    <div id="session-controls" class="session-controls" hidden>
      <span id="current-profile" class="current-profile"></span>
      <button id="change-role" class="ghost small">역할 바꾸기</button>

    <button id="reset" class="ghost small" hidden>시연 초기화</button>

  <p class="demo-note" role="note">가상 계정을 사용하는 시연이에요. 실제 로그인 기능은 아니에요. <span id="save-note"></span> <span id="entry-session-note" hidden>입장 상태를 저장할 수 없어 새로고침하면 역할을 다시 선택해야 할 수 있어요.</span></p>
  <main id="app" tabindex="-1"><p class="muted">불러오는 중…</p></main>
  <script type="module" src="./app.js"></script>
