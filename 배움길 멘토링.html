<title>배움길 멘토링</title>

<style>
/* 레이아웃: 흰 상단바 + 옅은 회색 바탕, 큰 제목·왼쪽 선 지표(참고 화면 구조) 아래에 기능 패널 */
:root{

  --fg:#16181b; --muted:#6a7079; --accent:#2350a8; --accent-soft:#eaf0fb;
  --ok:#17794a; --ok-soft:#e6f4ec; --warn:#a85f00; --warn-soft:#fbf1e2;
  --danger:#d3302c; --danger-soft:#fdeceb; --inf:#5b5fc7; --inf-soft:#eeeefb;

  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#191c20; --line:#2a2e34; --line-strong:#3d434c;
  --fg:#eceef1; --muted:#9aa1aa; --accent:#86a9f2; --accent-soft:#1d2a44;
  --ok:#4cc488; --ok-soft:#16301f; --warn:#e2a646; --warn-soft:#33270f;
  --danger:#ff6d64; --danger-soft:#3a1a19; --inf:#a5a8f5; --inf-soft:#24254a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#191c20; --line:#2a2e34; --line-strong:#3d434c;
  --fg:#eceef1; --muted:#9aa1aa; --accent:#86a9f2; --accent-soft:#1d2a44;
  --ok:#4cc488; --ok-soft:#16301f; --warn:#e2a646; --warn-soft:#33270f;
  --danger:#ff6d64; --danger-soft:#3a1a19; --inf:#a5a8f5; --inf-soft:#24254a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.logo{font-weight:700;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.logo i{font-style:normal;font-family:var(--mono);color:var(--muted);font-weight:500;font-size:17px;margin:0 3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.actions{margin-left:auto;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;position:relative}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:6px 4px;white-space:nowrap}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.danger{color:var(--danger)}
.badge{font-size:11px;font-weight:700;background:var(--danger);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 0 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.pop{position:absolute;right:0;top:44px;width:min(360px,90vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:8px;z-index:50}
.pop p{margin:0;padding:10px 12px;font-size:14px}
.pop p+p{border-top:1px solid var(--line)}
.notice{font-size:13px;color:var(--muted);padding-block:10px;border-bottom:1px solid var(--line);display:flex;gap:6px 16px;flex-wrap:wrap}
.notice b{color:var(--fg);font-weight:500}
.alert{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.alert.bad{border-color:var(--danger);background:var(--danger-soft)}
main.page{padding-block:44px 96px}
h1{font-size:clamp(32px,5.2vw,48px);font-weight:900;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:17px;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;margin:40px 0 44px}
.stat{border-left:2px solid var(--line);padding-left:20px;min-width:0}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:34px;font-weight:500;line-height:1.3;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:16px;color:var(--muted);font-weight:400;margin-left:4px}
.stat .v .txt{font-size:22px;display:block;line-height:1.45}
.stat .n{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:24px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.grid2.wide{grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr)}
.grid2.log{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
.grid2.res{grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:900px){.grid2,.grid2.wide,.grid2.log{grid-template-columns:1fr}}
@media (max-width:560px){.grid2.res{grid-template-columns:1fr;gap:16px}.cbar{grid-template-columns:110px minmax(0,1fr) 44px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
.panel-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:96px;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:500;cursor:pointer;min-height:40px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:20px;background:var(--surface)}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.gap{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.chip.review{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.inf{color:var(--inf);background:var(--inf-soft);border-color:transparent}
.chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.solid{color:var(--fg);border-color:var(--line-strong)}
button.chip{cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.opts label:has(input:checked){border-color:var(--fg);background:var(--bg);font-weight:500}
.opts input{accent-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.hl td{background:var(--accent-soft)}
.res-correct{color:var(--ok);font-weight:500;white-space:nowrap}
.res-incorrect{color:var(--danger);font-weight:500;white-space:nowrap}
.res-abstained{color:var(--warn);font-weight:500;white-space:nowrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:12.5px;padding:4px 10px;border-radius:8px;color:var(--muted);border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.step.done{color:var(--fg)} .step.done::before{content:"✓ ";color:var(--ok)}
.step.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.step.skip{text-decoration:line-through}
.step.na{opacity:.4}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 0}
.prog i{display:block;height:100%;background:var(--fg);border-radius:99px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.qtext{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-.015em;margin:14px 0 22px;font-variant-numeric:tabular-nums;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:17px;font-variant-numeric:tabular-nums;background:var(--surface)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);width:18px;height:18px}
.choice .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--danger);background:var(--danger-soft)}
.hintbox{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line-strong);font-size:14px}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.correct{background:var(--ok-soft)} .fb.incorrect{background:var(--danger-soft)} .fb.abstained{background:var(--warn-soft)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.empty{text-align:center;padding:48px 16px}
.empty h3{font-size:19px;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto;max-width:36ch}
/* 회차 타임라인 */
.timeline{display:flex;flex-direction:column}
.round{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.round:last-child{border-bottom:0}
.round .d{font-variant-numeric:tabular-nums}
.round .d b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.round .d span{font-size:20px;font-weight:700}
.round.cur .d span{color:var(--accent)}
.round .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.round{grid-template-columns:60px minmax(0,1fr)}.round .acts{grid-column:2;justify-content:flex-start}}
/* 결과지 */
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score b{font-size:52px;font-weight:900;letter-spacing:-.03em;line-height:1}
.score span{font-size:20px;color:var(--muted)}
.ritem{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.ritem + .ritem{margin-top:12px}
.ritem .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;border:1.5px solid var(--line-strong)}
.ritem.ok .no{border-color:var(--ok);color:var(--ok)}
.ritem.bad .no{border-color:var(--danger);color:var(--danger)}
.supp{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.supp h4{margin:0 0 8px;font-size:13px}
.cbars{display:flex;flex-direction:column;gap:10px}
.cbar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.cbar .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.cbar .tr i{display:block;height:100%;background:var(--fg)}
.cbar .v{font-variant-numeric:tabular-nums;text-align:right}
/* 온톨로지 */
.onto{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.onto svg{display:block;min-width:900px;width:100%;height:auto}
.onto .edge{fill:none;stroke-width:1.3;transition:opacity .15s}
.onto .edge.need,.onto .edge.part{stroke:var(--line-strong)}
.onto .edge.pre{stroke:var(--fg);stroke-width:1.7}
.onto .edge.eval{stroke:var(--muted);stroke-dasharray:2 3}
.onto .edge.cover{stroke:var(--accent);stroke-dasharray:6 4}
.onto .edge.dim{opacity:.1}
.onto .elabel{font-size:11px;fill:var(--fg);font-family:var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.onto .on{cursor:pointer;transition:opacity .15s}
.onto .on rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.onto .on text{fill:var(--fg);font-family:var(--sans);font-size:13px;font-weight:500}
.onto .on text.cls{font-size:10px;fill:var(--muted);font-weight:500;letter-spacing:.06em}
.onto .on text.s{font-size:11px;fill:var(--muted);font-weight:400}
.onto .cls-goal rect{fill:var(--fg);stroke:var(--fg)} .onto .cls-goal text,.onto .cls-goal text.cls,.onto .cls-goal text.s{fill:var(--bg)}
.onto .cls-domain rect{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
.onto .cls-template rect{fill:var(--bg);stroke-dasharray:3 2}
.onto .cls-template text{font-family:var(--mono);font-size:12px}
.onto .cls-round rect{fill:var(--accent-soft);stroke:var(--accent)}
.onto .cls-round.cur rect{fill:var(--accent)} .onto .cls-round.cur text,.onto .cls-round.cur text.cls,.onto .cls-round.cur text.s{fill:var(--surface)}
.onto .cls-round.planned rect{fill:var(--surface);stroke-dasharray:4 3}
.onto .st-ok rect{stroke:var(--ok);fill:var(--ok-soft)} .onto .st-ok text.s{fill:var(--ok)}
.onto .st-gap rect{stroke:var(--danger);fill:var(--danger-soft)} .onto .st-gap text.s{fill:var(--danger)}
.onto .st-review rect{stroke:var(--warn);fill:var(--warn-soft)} .onto .st-review text.s{fill:var(--warn)}
.onto .st-inf rect{stroke:var(--inf);stroke-dasharray:5 3} .onto .st-inf text.s{fill:var(--inf)}
.onto .st-unknown rect{stroke-dasharray:2 3}
.onto .st-later rect{stroke-dasharray:2 4;fill:var(--bg)} .onto .st-later text{fill:var(--muted)}
.onto .on.sel rect{stroke:var(--accent);stroke-width:2.6}
.onto .on.prio rect{stroke-width:2.6}
.onto .on.dim{opacity:.22}
.onto .on:focus{outline:none} .onto .on:focus-visible rect{stroke:var(--accent);stroke-width:3}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.legend svg{width:30px;height:8px;vertical-align:middle}
.relf{display:flex;gap:6px;flex-wrap:wrap}
.relf label{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--surface)}
.relf input{accent-color:var(--fg)}
.triple{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}

.pathline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pathline .ar{color:var(--muted)}
.sugg dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;margin:0;font-size:14px}
.sugg dt{color:var(--muted)} .sugg dd{margin:0}
@media (max-width:520px){.sugg dl{grid-template-columns:1fr;gap:2px}.sugg dd{margin-bottom:10px}}
.save{font-size:12px;color:var(--muted)} .save.fail{color:var(--danger)}
.sep{height:1px;background:var(--line);margin:20px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}

.aibox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--fg);border-radius:50%;animation:sp 0.9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:560px){.iconbtn .tx{display:none}}
/* 역할 선택·온보딩·프로필 */
.landing{max-width:880px;margin:0 auto;padding-block:56px 96px}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:32px}
.rolecard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:180px}

<script>
(() => {
'use strict';
/* =========================================================
   배움길 프론트 (해커톤 MVP 시연용)
   - 채점·문항 생성·단계 이동·집계: 이 파일의 규칙 코드

   - 저장: localStorage (한 브라우저 시연)
   ========================================================= */
const KEY='baeumgil:mvp:v1', SCHEMA=4;
const MENTOR='김멘토';
const AI_ENDPOINT='/api/ai', AI_TIMEOUT=15000, PROMPT_VER='goal-v1/roadmap28-v1/lesson-v1/log-v1';
const LN=()=>(state&&state.profile&&state.profile.name)||'멘티';

/* ── 고졸 검정고시 수학 개념 28개 ── */
const DOMAINS={D1:'기초 연산',D2:'문자와 식',D3:'방정식·부등식',D4:'함수',D5:'다항식·제곱근'};
const DOM_ORDER=['D1','D2','D3','D4','D5'];
const C=(name,dom,pre,ex)=>({name,dom,pre,ex});
const CONCEPTS={
  c01:C('자연수의 사칙연산','D1',[],'5 + 5 × 2'),
  c02:C('분수와 소수','D1',['c01'],'1/4 + 1/5'),
  c03:C('정수와 음수 계산','D1',['c01'],'(−5) × (−1)'),
  c04:C('거듭제곱','D1',['c03'],'2³'),
  c05:C('문자를 사용한 식','D2',['c01'],'공책 9권의 값을 문자로'),
  c06:C('식의 값','D2',['c05','c03'],'x = −4일 때 6x + 6'),
  c07:C('일차식의 계산','D2',['c05','c03'],'2(x + 1) − (x − 5)'),
  c08:C('등식의 성질','D3',['c05'],'a = b일 때 항상 옳은 것'),
  c09:C('일차방정식 풀이','D3',['c07','c08'],'5x − 2 = 2x + 10'),
  c10:C('부등식의 성질','D3',['c08'],'a < b일 때 옳은 것'),
  c11:C('일차방정식의 활용','D3',['c09'],'어떤 수의 3배보다 4 큰 수'),
  c12:C('연립일차방정식','D3',['c09'],'x + y = 9, x − y = 1'),
  c13:C('일차부등식','D3',['c09','c10'],'3x − 8 > −14'),
  c14:C('연립방정식의 활용','D3',['c12','c11'],'사과와 배 7개, 4500원'),
  c15:C('이차방정식(인수분해)','D3',['c28','c09'],'(x − 1)(x + 3) = 0'),
  c16:C('근의 공식','D3',['c15','c27'],'x² − 2x − 5 = 0'),
  c17:C('판별식','D3',['c16'],'x² − 8x + k = 0 중근'),
  c18:C('근과 계수의 관계','D3',['c16'],'x² − 9x − 7 = 0 두 근의 곱'),
  c19:C('좌표평면','D4',['c03'],'점 (4, −3)의 사분면'),
  c20:C('정비례와 반비례','D4',['c19','c06'],'x = 3일 때 y = 9'),
  c21:C('일차함수와 그래프','D4',['c20','c09'],'y = x − 4의 y절편'),
  c22:C('이차함수의 그래프','D4',['c21','c26'],'y = (x + 4)² − 3 꼭짓점'),
  c23:C('이차함수와 이차방정식','D4',['c22','c15'],'y = x² − 3x − 4와 x축'),
  c24:C('지수법칙','D5',['c04'],'a⁸ ÷ a⁶'),
  c25:C('제곱근','D5',['c04'],'49의 양의 제곱근'),
  c26:C('곱셈 공식','D5',['c07','c24'],'(x + 4)²'),
  c27:C('근호를 포함한 식의 계산','D5',['c25'],'√2 × √18'),
  c28:C('인수분해','D5',['c26'],'x² − 14x + 48'),
};
const ORDER=Object.keys(CONCEPTS);
const PRE=[];ORDER.forEach(c=>CONCEPTS[c].pre.forEach(f=>PRE.push([f,c])));
const SUCC={};ORDER.forEach(c=>SUCC[c]=PRE.filter(([f])=>f===c).map(([,t])=>t));
function closure(c,next){const out=new Set();const st=[...next(c)];while(st.length){const x=st.pop();if(out.has(x))continue;out.add(x);st.push(...next(x));}return out;}
const ANC={},DESC={};ORDER.forEach(c=>{ANC[c]=closure(c,x=>CONCEPTS[x].pre);DESC[c]=closure(c,x=>SUCC[x]);});
const DEPTH={};(function(){const d=c=>DEPTH[c]??(DEPTH[c]=CONCEPTS[c].pre.length?1+Math.max(...CONCEPTS[c].pre.map(d)):0);ORDER.forEach(d);})();
/* 고졸 수학 목표 범위 — 멘토가 도달 정도를 확인 */
const TARGETS=[
  {id:'T1',name:'다항식의 연산',needs:['c07','c24','c26']},
  {id:'T2',name:'인수분해',needs:['c26','c28']},
  {id:'T3',name:'이차방정식',needs:['c15','c16','c17','c18']},
  {id:'T4',name:'이차함수',needs:['c22','c23']},
  {id:'T5',name:'고차방정식',needs:['c28','c15','c16'],beyond:true},
  {id:'T6',name:'이차부등식',needs:['c13','c23'],beyond:true},
  {id:'T7',name:'두 점 사이의 거리',needs:['c19','c25','c27'],beyond:true},
];
const STATUS={
  ok:{t:'최근 응답 정답',sym:'✓',chip:'ok'}, gap:{t:'보완 필요',sym:'!',chip:'gap'},
  review:{t:'확인 필요(상충)',sym:'?',chip:'review'}, inf:{t:'관계상 추정 · 앎',sym:'~',chip:'inf'},
  infgap:{t:'선수 보완 후 확인',sym:'~!',chip:'review'}, unknown:{t:'미확인',sym:'·',chip:''},
};
const STAGES=[['concept','개념 확인'],['foundation','기초 연습'],['similar','유사 문제'],['retry','기출 재도전'],['transfer','새 적용 확인']];
const SL={original:'회차 기출',diagnostic:'레벨테스트',...Object.fromEntries(STAGES)};

/* ── 검수된 문항 틀 (개념당 1개, 코드가 정답 계산·조건 검사) ── */
const fmt=n=>typeof n==='number'?(n<0?'−'+Math.abs(n):String(n)):n;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=ri(a,b);while(v===0)v=ri(a,b);return v;};
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const tail=n=>n===0?'':(n<0?` − ${-n}`:` + ${n}`);
const xterm=c=>c===0?'':c===1?' + x':c===-1?' − x':(c<0?` − ${-c}x`:` + ${c}x`);
const lead=c=>c===1?'x':c===-1?'−x':`${fmt(c)}x`;
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(ch=>SUPD[ch]).join('');
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):`${n}/${d}`;};
const quad=(x,y)=>x>0&&y>0?'제1사분면':x<0&&y>0?'제2사분면':x<0&&y<0?'제3사분면':'제4사분면';
const T={
  c01:{hint:'곱셈·나눗셈을 덧셈·뺄셈보다 먼저 계산해요.',gen:()=>({a:ri(2,9),b:ri(2,9),c:ri(2,9)}),
    build:({a,b,c})=>({text:`${a} + ${b} × ${c}의 값은?`,ans:a+b*c,dis:[(a+b)*c,a*b+c,a+b+c],exp:`${b} × ${c} = ${b*c} 먼저, ${a} + ${b*c} = ${a+b*c}`})},
  c02:{hint:'분모를 같게 통분한 뒤 분자끼리 더해요.',gen:()=>{const a=ri(2,6);return{a,b:ri(a+1,9)};},
    build:({a,b})=>({text:`1/${a} + 1/${b}의 값은?`,ans:F(a+b,a*b),dis:[F(2,a+b),F(1,a+b),F(2,a*b)],exp:`${b}/${a*b} + ${a}/${a*b} = ${F(a+b,a*b)}`})},
  c03:{hint:'부호가 같은 두 수의 곱은 양수, 다른 두 수의 곱은 음수예요.',gen:()=>({a:ri(2,9),b:ri(2,9)}),
    build:({a,b})=>({text:`(${fmt(-a)}) × (${fmt(-b)})의 값은?`,ans:a*b,dis:[-a*b,-(a+b),a+b],exp:`(−) × (−) = (+) → ${a*b}`})},
  c04:{hint:'aⁿ은 a를 n번 곱한 거예요.',gen:()=>({a:ri(2,5),n:ri(2,4)}),
    build:({a,n})=>({text:`${a}${sup(n)}의 값은?`,ans:a**n,dis:[a*n,a+n,a**(n-1)],exp:`${Array(n).fill(a).join(' × ')} = ${a**n}`})},
  c05:{hint:'숫자와 문자의 곱은 숫자를 앞에 쓰고 × 기호를 생략해요.',gen:()=>({n:ri(2,9),k:ri(0,2)}),
    build:({n,k})=>{const it=[['권','공책'],['자루','연필'],['개','지우개']][k];return{text:`한 ${it[0]}에 a원인 ${it[1]} ${n}${it[0]}의 값을 문자로 나타내면?`,ans:`${n}a원`,dis:[`(a + ${n})원`,`(a ÷ ${n})원`,`${n}a²원`],exp:`a × ${n} = ${n}a`};}},
  c06:{hint:'x 자리에 값을 넣고, 음수는 괄호를 씌워 계산해요.',gen:()=>({k:nz(-5,5),a:ri(2,7),b:nz(-9,9)}),
    build:({k,a,b})=>({text:`x = ${fmt(k)}일 때 ${a}x${tail(b)}의 값은?`,ans:a*k+b,dis:[a*(-k)+b,a*k-b,a+k+b],exp:`${a} × (${fmt(k)})${tail(b)} = ${fmt(a*k+b)}`})},
  c07:{hint:'분배법칙으로 괄호를 풀고, 괄호 앞의 −는 안의 부호를 모두 바꿔요.',gen:()=>({a:ri(2,5),p:ri(1,6),q:ri(1,6)}),
    build:({a,p,q})=>({text:`${a}(x + ${p}) − (x − ${q})를 간단히 하면 ${lead(a-1)} + □입니다. □는?`,ans:a*p+q,dis:[a*p-q,p+q,a*p],exp:`${a}x + ${a*p} − x + ${q} = ${lead(a-1)} + ${a*p+q}`})},
  c08:{hint:'양변에 같은 수를 더하거나 빼거나 곱해도 등식은 성립해요.',gen:()=>({k:ri(2,9),v:ri(0,3)}),
    build:({k,v})=>{const ok=[`a + ${k} = b + ${k}`,`a − ${k} = b − ${k}`,`${k}a = ${k}b`,`a ÷ ${k} = b ÷ ${k}`],no=[`a + ${k} = b − ${k}`,`${k}a = b + ${k}`,`a − ${k} = ${k} − b`,`a ÷ ${k} = ${k}b`];
      return{text:'a = b일 때 항상 옳은 것은?',ans:ok[v],dis:no.filter((_,i)=>i!==v).slice(0,3),exp:'양변에 똑같은 계산을 한 식만 항상 성립해요'};}},
  c09:{hint:'x항은 왼쪽, 수는 오른쪽으로 옮기고(부호가 바뀌어요) 계수로 나눠요.',gen:()=>{const a=ri(3,7);return{a,c:ri(1,a-1),x:nz(-5,6),b:ri(1,9)};},
    build:({a,c,x,b})=>{const d=(a-c)*x-b;return{text:`${a}x − ${b} = ${lead(c)}${tail(d)}의 해 x는?`,ans:x,dis:[-x,(d-b)/(a-c),(d+b)/(a+c),x+1,x-1],exp:`${a-c}x = ${fmt(d+b)} → x = ${fmt(x)}`,prefix:'x = '};}},
  c10:{hint:'음수를 곱하거나 나누면 부등호 방향이 바뀌어요.',gen:()=>({k:ri(2,5),v:ri(0,3)}),
    build:({k,v})=>{const ok=[`a + ${k} < b + ${k}`,`−${k}a > −${k}b`,`${k}a < ${k}b`,`a − ${k} < b − ${k}`],no=[`a + ${k} > b + ${k}`,`−${k}a < −${k}b`,`${k}a > ${k}b`,`a − ${k} > b − ${k}`];
      return{text:'a < b일 때 옳은 것은?',ans:ok[v],dis:no.filter((_,i)=>i!==v).slice(0,3),exp:'더하기·빼기·양수 곱은 방향 유지, 음수 곱은 방향 반대'};}},
  c11:{hint:'어떤 수를 x로 놓고 문장을 식으로 바꿔요.',gen:()=>({a:ri(2,6),x:ri(2,12),b:ri(1,9)}),
    build:({a,x,b})=>{const c=a*x+b;return{text:`어떤 수의 ${a}배보다 ${b}만큼 큰 수는 ${c}입니다. 어떤 수는?`,ans:x,dis:[(c+b)/a,c-b,x+1,x+2],exp:`${a}x + ${b} = ${c} → x = ${x}`};}},
  c12:{hint:'두 식을 더하면 y가 사라져요.',gen:()=>{const x=ri(1,9);let y=ri(1,9);while(y===x)y=ri(1,9);return{x,y};},
    build:({x,y})=>({text:`x + y = ${x+y}, x − y = ${fmt(x-y)}일 때 x의 값은?`,ans:x,dis:[y,x+y,x-y,x+1],exp:`두 식을 더하면 2x = ${2*x} → x = ${x}`,prefix:'x = '})},
  c13:{hint:'일차방정식처럼 풀되, 음수로 나누면 부등호 방향을 바꿔요.',gen:()=>({a:ri(2,6),k:ri(-5,5),b:ri(1,9)}),
    build:({a,k,b})=>{const c=a*k-b;return{text:`${a}x − ${b} > ${fmt(c)}의 해는 x > □입니다. □는?`,ans:k,dis:[-k,(c-b)/a,k+1,k-1],exp:`${a}x > ${fmt(c+b)} → x > ${fmt(k)}`};}},
  c14:{hint:'사과를 x개, 배를 y개로 놓고 개수 식과 금액 식을 세워요.',gen:()=>{const n=ri(5,9);return{p:pickOne([300,400,500]),q:pickOne([600,700,800]),n,y:ri(1,n-1)};},
    build:({p,q,n,y})=>{const t=p*(n-y)+q*y;return{text:`${p}원짜리 사과와 ${q}원짜리 배를 합쳐 ${n}개 사고 ${t}원을 냈습니다. 배는 몇 개인가요?`,ans:y,dis:[n-y,y+1,y-1,y+2],exp:`x + y = ${n}, ${p}x + ${q}y = ${t} → y = ${y}`,suffix:'개'};}},
  c15:{hint:'곱이 0이면 둘 중 하나는 0이에요.',gen:()=>{const p=ri(1,9);let q=ri(1,9);while(q===p)q=ri(1,9);return{p,q};},
    build:({p,q})=>({text:`(x − ${p})(x + ${q}) = 0의 해 중 양수인 해는?`,ans:p,dis:[-p,q,-q],exp:`x = ${p} 또는 x = ${fmt(-q)}`,prefix:'x = '})},
  c16:{hint:'x = (−b ± √(b² − 4ac)) / 2a, 짝수 공식도 써 보세요.',gen:()=>{let a,c;do{a=ri(1,4);c=ri(1,9);}while(Number.isInteger(Math.sqrt(a*a+c)));return{a,c};},

function buildSchedule(order,cs,start){
  const end=examDate(start);const weeksTotal=Math.max(6,Math.floor((Date.parse(end)-Date.parse(start))/(7*864e5)));
  const mock=weeksTotal>=10?2:1;const learnW=weeksTotal-mock;
  const L=order.reduce((n,c)=>n+loadOf(cs[c].s),0);
  const buckets=Array.from({length:learnW},()=>[]);let cum=0;
  order.forEach(c=>{const idx=Math.min(learnW-1,Math.floor(cum/L*learnW));buckets[idx].push(c);cum+=loadOf(cs[c].s);});
  const compressed=buckets.some(b=>b.length>3);
  const out=buckets.map(b=>b.length?{kind:'learn',concepts:b}:{kind:'review',concepts:[]});
  for(let i=0;i<mock;i++)out.push({kind:'mock',concepts:[]});
  out.forEach((w,i)=>{w.no=i+1;w.date=addDays(start,i*7);
    if(w.kind==='review'){const prev=out.slice(Math.max(0,i-3),i).flatMap(x=>x.concepts);w.concepts=prev.slice(-3);}

  return{weeks:out,end,compressed,weeksTotal};
}

}

const DIAG_MAX=10;
function nextDiagConcept(d){
  if(d.mode==='full'){return topoOrder().find(c=>!d.asked.includes(c))||null;}
  if(d.asked.length>=DIAG_MAX)return null;
  const known=c=>d.asked.includes(c)||d.inferred[c]==='inf';
  const cand=ORDER.filter(c=>!known(c));if(!cand.length)return null;
  let best=null,score=-1;
  cand.forEach(c=>{const a=[...ANC[c]].filter(x=>!known(x)).length,b=[...DESC[c]].filter(x=>!known(x)).length;
    const v=Math.min(a,b)*2+(a+b)*0.2+(d.inferred[c]==='infgap'?-0.5:0);if(v>score){score=v;best=c;}});
  return best;
}
function diagInfer(d,c,res){
  delete d.inferred[c];
  if(res==='correct')ANC[c].forEach(x=>{if(!d.asked.includes(x))d.inferred[x]='inf';});
  else DESC[c].forEach(x=>{if(!d.asked.includes(x)&&!d.inferred[x])d.inferred[x]='infgap';});
}

function diagEnsure(){const d=state.diag;if(d.insts.length>d.idx)return;const c=nextDiagConcept(d);if(!c)return;
  const i=fresh(c,d.used,false);if(!i){d.asked.push(c);return diagEnsure();}i.src=d.mode==='full'?'레벨테스트 · 전체 확인':'레벨테스트';d.used.push(i.key);d.asked.push(c);d.insts.push(i);}

  if(d.idx>=d.insts.length){d.status='done';d.finished=nowISO();state.cursor=null;d.attIds.forEach(id=>{const x=state.attempts.find(z=>z.id===id);if(x)state.exposures[x.key].answerShown=true;});}
}

/* ── 오답 보완 경로 엔진 ── */
function setStage(p,stage,insts){p.stage=stage;p.queue=insts;p.i=0;p.displayed=null;p.pending=null;p.curMs=0;insts.forEach(x=>p.used.push(x.key));}
function makeSet(p,tid,n){const out=[];for(let k=0;k<n;k++){const i=fresh(tid,p.used.concat(out.map(o=>o.key)),false);if(!i)return null;out.push(i);}return out;}
function goConcept(p){if(!CFG[p.tid].checks.length){p.focus=null;return goFoundation(p);}const set=CFG[p.tid].checks.map(t=>fresh(t,p.used,false));if(set.some(x=>!x))return stuck(p,'개념 확인 문항을 준비하지 못했어요');setStage(p,'concept',set);}
function goFoundation(p){p.bundle++;const tid=FOCUS_TID[p.focus]||CFG[p.tid].core;const set=makeSet(p,tid,3);if(!set)return stuck(p,'기초 연습 문항을 준비하지 못했어요');setStage(p,'foundation',set);}
function goSimilar(p){const set=makeSet(p,CFG[p.tid].core,2);if(!set)return stuck(p,'유사 문제를 준비하지 못했어요');setStage(p,'similar',set);}
function goRetry(p){p.stage='retry';p.queue=[Object.assign({},p.orig)];p.i=0;p.displayed=null;p.pending=null;p.curMs=0;}
function goTransfer(p){const i=fresh(CFG[p.tid].core,p.used,true);if(!i){p.transfer='not_measured';p.transferWhy='앱 기록에 없는 새 문항을 확보하지 못했어요';return finish(p);}p.transfer='measured';setStage(p,'transfer',[i]);}
function stuck(p,why){p.stuck=why;p.status='needs_mentor';p.stage='done';}
function finish(p){p.stage='done';p.status=(p.transfer==='not_measured'||p.mentorFlag)?'needs_mentor':'completed';p.needsReview=p.skipped.length>0||p.overrides.length>0;}
const stageAtt=(p,st)=>state.attempts.filter(a=>a.pathId===p.id&&a.stage===st);
function nextInPath(p){
  const st=p.stage;p.i++;p.displayed=null;p.curMs=0;
  if(p.i<p.queue.length)return;
  if(st==='concept'){const f=stageAtt(p,'concept').find(a=>a.result!=='correct');p.focus=f?f.concept:null;p.pending={type:'concept'};return;}
  if(st==='foundation'){p.pending={type:'bundle',correct:stageAtt(p,'foundation').filter(a=>a.bundle===p.bundle&&a.result==='correct').length};return;}
  if(st==='similar'){if(!stageAtt(p,'similar').some(a=>a.result==='correct'))p.mentorFlag=true;goRetry(p);return;}
  if(st==='retry'){goTransfer(p);return;}
  if(st==='transfer')finish(p);
}
function skipStage(p){p.skipped.push(p.stage);p.needsReview=true;
  if(p.stage==='concept'){p.focus=null;goFoundation(p);}else if(p.stage==='foundation')goSimilar(p);else if(p.stage==='similar')goRetry(p);}

}

async function postServer(payload,signal){
  const ctrl=new AbortController();let timedOut=false;const t=setTimeout(()=>{timedOut=true;ctrl.abort();},AI_TIMEOUT);
  signal?.addEventListener('abort',()=>ctrl.abort());

/* prompt: Claude(sample)에 보낼 지시+자료, payload: 서버 /api/ai로 보낼 구조화 입력 */
async function askAI(prompt,payload,validate){
  const ctrl=new AbortController();ui.aiCtrl=ctrl;
  await sampleReady;
  let res;
  if(sampleFn){
    try{const out=await sampleFn.json(prompt,{modelTier:'default',signal:ctrl.signal,cache:false});res={status:'ok',output:out,source:'claude'};}
    catch(e){res={status:e&&e.code==='cancelled'?'canceled':'failed',reason:SAMPLE_ERR[e&&e.code]||'AI 응답을 받지 못했어요.',source:'claude'};}

/* 로드맵 추천 (28개 개념 전체 순서 → 코드가 검정고시 일정에 맞춰 주간 배치) */
function topoOrder(){
  const indeg={};ORDER.forEach(c=>indeg[c]=CONCEPTS[c].pre.length);const out=[];
  const pr=c=>DEPTH[c]*100+DOM_ORDER.indexOf(CONCEPTS[c].dom)*10+ORDER.indexOf(c)/100;
  let ready=ORDER.filter(c=>!indeg[c]);
  while(ready.length){ready.sort((a,b)=>pr(a)-pr(b));const c=ready.shift();out.push(c);SUCC[c].forEach(t=>{if(--indeg[t]===0)ready.push(t);});}
  return out;
}

규칙:

- ${DATA_RULE}
JSON 하나만 답한다:
{"kind":"roadmap","start":"개념 id","order":["c01", "..."],"notes":[{"conceptId":"개념 id","why":"40자 이내"}],"summary":"두 문장 이내"}
자료: ${JSON.stringify(data)}`;

function validateRoadmap(o){
  if(!o||o.kind!=='roadmap'||!Array.isArray(o.order))return['구조가 올바르지 않아요'];
  if(o.order.length!==ORDER.length||new Set(o.order).size!==ORDER.length||o.order.some(c=>!CONCEPTS[c]))return['개념 28개가 빠짐없이 한 번씩 들어 있지 않아요'];
  if(!o.order.includes(o.start))return['시작 개념이 순서에 없어요'];
  if(PRE.some(([f,t])=>o.order.indexOf(f)>o.order.indexOf(t)))return['선수 관계 순서를 어겼어요'];
  return[];
}
function ruleRoadmap(){const cs=conceptStatus();const order=topoOrder();
  const notes={};order.forEach(c=>{const s=cs[c].s;notes[c]=s==='ok'?'레벨테스트 정답 · 짧게 복습':s==='inf'?'다음 개념을 맞혀 안다고 추정 · 짧게 확인':s==='gap'?'레벨테스트에서 틀렸어요 · 충분히 연습':s==='infgap'?'선수 개념이 약해 함께 다져요':s==='review'?'응답이 엇갈려 다시 확인':'아직 응답이 없어 확인이 필요해요';});
  const start=order.find(c=>!['ok','inf'].includes(cs[c].s))||order[0];
  return{order,start,notes,summary:'선수 관계 순서대로 28개 개념을 모두 배치했어요. 아는 것으로 보이는 개념은 짧게 복습하고, 보완이 필요한 개념에 시간을 더 써요.'};}
function applyRoadmap(rm){
  const start=todayKST();const sch=buildSchedule(rm.order,conceptStatus(),start);
  rm.schedule={end:sch.end,compressed:sch.compressed,weeksTotal:sch.weeksTotal};
  const started=state.rounds.filter(r=>runOf(r.no));
  state.rounds=started.length?state.rounds:roundsFromSchedule(sch,start);
  if(started.length)rm.keptRounds=true;
  return rm;
}

function validateLesson(inp,out){

function dreamPath(p,req){
  const o=req&&req.output;const steps=[];
  steps.push(`<div class="st goal"><span class="dot"></span><div><div class="tt">${esc(p.goal||'목표')}</div>${o?`<div class="dd">${esc(o.goalSummary||'')}</div>`:''}</div></div>`);
  if(o){o.requirements.forEach(r=>steps.push(`<div class="st"><span class="dot"></span><div><div><span class="reqtag">${esc(r.type)}</span><b>${esc(r.title)}</b> <span class="chip ${r.required?'solid':''}">${r.required?'필수':'선택·도움'}</span></div><div class="dd">${esc(r.detail||'')}</div></div></div>`));
    if(o.exam&&o.exam!=='null'&&!o.requirements.some(r=>/검정고시/.test(r.title)))steps.push(`<div class="st"><span class="dot"></span><div><div class="tt">${esc(o.exam)} 검정고시 합격</div><div class="dd">학교 밖에서 학력을 얻는 방법</div></div></div>`);
    steps.push(`<div class="st"><span class="dot"></span><div><div class="tt" style="font-weight:500">수학 목표 · ${esc(o.mathFocus||'검정고시 수학')}</div></div></div>`);}
  const rm=state.roadmap;const start=rm&&rm.status==='ok'&&rm.start?CONCEPTS[rm.start].name:null;
  steps.push(`<div class="st today"><span class="dot"></span><div><div class="tt">${start?`오늘 시작 · ${esc(start)}`:'오늘 시작 · 레벨테스트로 시작점을 찾아요'}</div></div></div>`);
  return `<div class="road2">${steps.join('')}</div>`;
}

function diagResult(){

  const rm=state.roadmap;
  return `<h1>레벨테스트 결과</h1><p class="sub">${atts.length}문제로 개념 28개의 상태를 살펴봤어요. 정답 ${atts.filter(a=>a.result==='correct').length}개 · 모름 ${atts.filter(a=>a.result==='abstained').length}개</p>
  <div class="stats">${stat('직접 확인',direct,'문제로 확인한 개념')}${stat('관계로 추정',inferred,'선수 관계로 짐작')}${stat('미확인',unk,'아직 알 수 없음')}</div>

function pathMini(p){

}

function ruleSuggestion(){
  const cs=conceptStatus();const focus=state.priority||pathOrder({cs})[0];if(!focus)return null;
  const ev=state.attempts.filter(a=>a.concept===focus).slice(-4);const memo=state.sessions.filter(s=>s.memo).slice(-1)[0];
  const items=state.rounds.filter(r=>r.concepts.includes(focus)).map(r=>`${r.no}회차(${md(r.date)})`);
  const unc=[];if(ev.length<3)unc.push(`이 개념 응답이 ${ev.length}건뿐이에요. 풀이 과정을 직접 들어 보세요.`);
  if(ev.some(a=>a.hint||a.helped))unc.push('힌트·도움을 받은 응답이 섞여 있어요.');
  unc.push('같은 오답이 실수인지 개념 문제인지는 응답만으로 구분하기 어려워요.');
  return{focus,ev,memo,items,unc,cs};

    const probs=[];if(curS.attendance!=='attended')probs.push('출석으로 기록된 회기만 확정할 수 있어요');
    if(!(Number.isInteger(+curS.minutes)&&+curS.minutes>0))probs.push('실제 활동 시간을 1분 이상으로 입력해 주세요');
    if(!curS.final.trim())probs.push('일지 내용을 입력해 주세요');if(!curS.reviewed)probs.push('원자료와 비교해 검토했다고 체크해 주세요');
    form=`<div class="panel-h"><h2>${curS.date} (${wd(curS.date)}) 회기</h2><div class="row"><span class="chip">제공받은 양식 일치 검수 전</span><span data-save class="save"></span></div></div>
      <div class="fgrid">
        <div class="field"><label class="lbl" for="s-date">회기 날짜</label><input type="date" id="s-date" data-sf="date" value="${curS.date}"></div>
        <div class="field"><label class="lbl" for="s-att">출석</label><select id="s-att" data-sf="attendance">${Object.entries(ATT).map(([k,v])=>`<option value="${k}" ${curS.attendance===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="s-min">실제 활동 시간(분)</label><input type="number" id="s-min" min="1" step="1" data-sf="minutes" value="${curS.minutes||''}" placeholder="예: 60"></div>
        <div class="field"><label class="lbl" for="s-run">연결 회차</label><select id="s-run" data-sf="runId"><option value="">연결 안 함</option>${runOpts}</select></div>
      </div>
      <div class="field" style="margin-top:16px"><label class="lbl" for="s-memo">관찰 메모</label><textarea id="s-memo" data-sf="memo" placeholder="학생의 풀이 과정, 반응 등 직접 본 내용을 적어 주세요. 메모가 없으면 태도·감정 문장은 만들지 않아요.">${esc(curS.memo)}</textarea></div>
      <div class="field" style="margin-top:16px"><span class="lbl">사실 요약 <span class="muted" style="font-weight:400">(학습 기록에서 코드로 계산)</span></span><div class="small" style="padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)">${esc(logFacts(curS).text)}</div></div>
      <div class="field" style="margin-top:16px"><div class="row" style="justify-content:space-between"><label class="lbl" for="s-final" style="margin:0">활동일지 내용 ${curS.draftSource==='ai'?`<span class="chip ok">AI 초안${ai&&ai.source?` · ${SRC[ai.source]}`:''} · 검토 필요</span>`:curS.draftSource==='rule'?'<span class="chip">규칙 기반 초안</span>':''}</label>
        <div class="row"><button class="btn sm" data-act="draft-ai" ${ui.aiBusy.log?'disabled':''}>${ui.aiBusy.log?'<span class="spin"></span> AI 작성 중':'AI 문장 초안'}</button><button class="btn sm ghost" data-act="draft-rule">규칙 기반 초안</button></div></div>
        ${ai&&['failed','canceled'].includes(ai.status)?`<div class="alert bad" style="margin:0">${esc(ai.reason)} 규칙 기반 초안이나 직접 작성으로 계속할 수 있어요.</div>`:''}
        <textarea id="s-final" data-sf="final" style="min-height:150px" placeholder="초안을 만들거나 직접 작성해 주세요">${esc(curS.final)}</textarea></div>
      <label class="row small" style="margin-top:12px;cursor:pointer;gap:8px"><input type="checkbox" data-sf="reviewed" ${curS.reviewed?'checked':''}> 원자료와 비교해 작성 내용을 검토했어요</label>
      ${probs.length?`<p class="small muted" style="margin:10px 0 0">${probs.map(x=>'· '+x).join('<br>')}</p>`:''}
      <div class="qfoot"><div class="row">${confirmed?`<input type="text" id="wd-why" placeholder="철회 이유" style="min-height:40px;width:200px"><button class="btn warn sm" data-act="withdraw">확정 철회</button>`:''}</div>
        <button class="btn primary" data-act="confirm" ${probs.length?'disabled':''}>${confirmed?'수정본으로 다시 확정':'확정하기'}</button></div>
      ${curS.revisions.length?`<div class="sep"></div><h3 style="margin-bottom:6px">개정 이력</h3>${curS.revisions.map(x=>`<div class="small" style="padding:3px 0">${x.rev?`${x.rev}판 확정`:'철회'} · ${dt(x.at)}${x.minutes?` · ${x.minutes}분`:''}${x.reason?` · ${esc(x.reason)}`:''}</div>`).join('')}`:''}`;}
  const lrows=ledger.map(s=>{const r=latestRev(s);return `<tr><td class="num">${s.date}</td><td>${esc(LN())}(가명)</td><td class="num">${r.minutes}분</td><td style="min-width:280px">${esc(r.text)}</td><td class="small muted">${s.id} · ${r.rev}판</td></tr>`;}).join('');
  return head('활동일지·월별 대장','실제 회기를 기록하고 확정하면 월별 대장에 한 번씩 합산됩니다',
    stat(`${+month.slice(5)}월 확정 회기`,ledger.length)+stat('활동 시간 합계',`${total}<small>분</small>`)+stat('초안·철회',state.sessions.filter(s=>!latestRev(s)||latestRev(s).status!=='confirmed').length,'대장 합산 제외'))+`
  <div class="grid2 log">
    <section class="panel"><div class="panel-h"><h2>회기</h2><button class="btn sm" data-act="sess-new">새 회기</button></div><div class="list">${sList||'<p class="small muted">아직 회기가 없어요.</p>'}</div>
      <p class="small muted" style="margin:12px 0 0">학생이 혼자 푼 학습은 회기로 자동 기록되지 않아요. 실제 수업 후 멘토가 직접 입력합니다.</p></section>
    <section class="panel">${form}</section></div>
  <section class="panel" style="margin-top:24px"><div class="panel-h"><h2>월별 멘토링 대장</h2><div class="row"><select data-month aria-label="월 선택" style="min-height:40px;width:auto">${months.map(m=>`<option ${m===month?'selected':''}>${m}</option>`).join('')}</select><button class="btn sm" data-act="copy" ${ledger.length?'':'disabled'}>표 복사</button></div></div>
    ${ledger.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>날짜</th><th>멘티</th><th>활동 시간</th><th>활동 내용</th><th>일지</th></tr></thead><tbody>${lrows}<tr><td colspan="2"><b>합계 ${ledger.length}회</b></td><td class="num"><b>${total}분</b></td><td colspan="2" class="small muted">최신 확정본 기준 · 초안·결석·취소·철회 제외</td></tr></tbody></table></div>`:`<div class="empty"><h3>${month} 확정 회기가 없습니다</h3><p>회기를 확정하면 여기에 자동으로 합산됩니다.</p></div>`}
    ${ui.copyFallback?`<p class="small muted" style="margin:14px 0 6px">클립보드에 복사하지 못했어요. 아래 내용을 선택해 복사해 주세요.</p><pre class="copy">${esc(ui.copyFallback)}</pre>`:''}
    ${ui.msg&&state.view.mentor==='log'?`<p class="small" style="margin:12px 0 0">${esc(ui.msg)}</p>`:''}</section>`;
}

/* ── 레이아웃 ── */
const TABS={mentee:[['profile','프로필·학습 분석'],['roadmap','로드맵'],['quiz','회차별 기출 퀴즈']],
  mentor:[['analysis','학습 분석'],['rounds','회차·진도'],['roadmap','로드맵'],['log','활동일지']]};
function notifs(){
  if(state.mode==='mentor')return state.paths.filter(p=>p.status==='needs_mentor').map(p=>`확인 요청 · ${p.orig.text}`);
  if(state.onboard!=='done')return['시작 설정을 마치면 회차별 학습이 열려요'];
  const out=[];const cr=currentRound();if(roundState(cr)==='open')out.push(`${cr.no}회차 기출 세트가 열렸어요 · ${cr.title}`);
  const rem=state.paths.filter(p=>p.status==='ready').length;if(rem)out.push(`틀린 문제 ${rem}개에 보충 문제가 준비돼 있어요`);return out;
}
function isDark(){const t=document.documentElement.dataset.theme;if(t)return t==='dark';return matchMedia('(prefers-color-scheme: dark)').matches;}
function render(){
  const app=document.getElementById('app');
  if(!state.picked){app.innerHTML=`<div class="wrap">${viewLanding()}</div>`;return;}
  const mode=state.mode;if(mode==='mentee'&&!TABS.mentee.some(t=>t[0]===state.view.mentee))state.view.mentee='quiz';
  const v=state.view[mode];const ns=notifs();const onboarding=mode==='mentee'&&state.onboard!=='done';
  let main;
  if(onboarding)main=viewOnboard();
  else if(mode==='mentee'){const c=cur();main=c&&c.kind==='diag'?obSteps('diag')+diagRunner(c):v==='profile'?viewProfile():v==='roadmap'?viewRoadmap(false):viewQuiz();}
  else main=v==='analysis'?viewAnalysis():v==='rounds'?viewRounds():v==='roadmap'?viewRoadmap(true):viewLog();
  const alerts=[];
  if(tabConflict)alerts.push('<div class="alert bad"><b>다른 탭에서 기록이 바뀌었어요.</b> 이 탭은 저장을 멈췄어요. 새로 고침해 최신 기록을 불러와 주세요.</div>');
  else if(corruptRaw!=null)alerts.push(`<div class="alert bad"><b>저장된 기록을 읽지 못했어요.</b> 기존 기록은 지우지 않았고, 지금은 새 시연 데이터를 저장 없이 보여 주고 있어요. <button class="btn sm" data-act="raw">기존 기록 원문 보기</button><button class="btn sm warn" data-act="raw-replace">새 시연 데이터로 저장</button>${ui.showRaw?`<pre class="copy" style="width:100%">${esc(corruptRaw.slice(0,4000))}</pre>`:''}</div>`);
  if(saveStatus==='fail')alerts.push('<div class="alert bad">이 브라우저에 저장하지 못했어요. 화면의 내용은 그대로 있어요. 저장 공간이나 브라우저 설정을 확인해 주세요.</div>');
  app.innerHTML=`
  <header class="top"><div class="wrap"><div class="bar">
    <div class="logo">배움<i>→</i>길</div>
    <div class="seg" role="group" aria-label="사용자 모드"><button aria-pressed="${mode==='mentor'}" data-act="mode" data-m="mentor">멘토</button><button aria-pressed="${mode==='mentee'}" data-act="mode" data-m="mentee">멘티</button></div>
    <div class="actions">
      <button class="iconbtn" data-act="theme" aria-label="${isDark()?'밝은':'어두운'} 화면으로 바꾸기">${isDark()?ic.sun:ic.moon}</button>
      <button class="iconbtn" data-act="pop" aria-expanded="${ui.pop}">${ic.bell}<span class="tx">알림</span>${ns.length?`<span class="badge">${ns.length}</span>`:''}</button>
      <button class="iconbtn" data-act="${mode==='mentee'&&!onboarding?'me':'noop'}">${ic.user}<span class="tx">${mode==='mentor'?MENTOR:esc(state.profile.name||'멘티')+(state.profile.name?'(가명)':'')}</span></button>
      ${ui.resetAsk?'<span class="row small"><span>저장된 기록을 모두 지우고 역할 선택으로 돌아갈까요?</span><button class="btn sm warn" data-act="reset-yes">지우기</button><button class="btn sm" data-act="reset-no">취소</button></span>':`<button class="iconbtn danger" data-act="reset">${ic.reset}<span class="tx">시연 초기화</span></button>`}
      ${ui.pop?`<div class="pop" role="dialog" aria-label="알림">${ns.length?ns.map(n=>`<p>${esc(n)}</p>`).join(''):'<p class="muted">새 알림이 없어요.</p>'}</div>`:''}
    </div></div>
    ${onboarding?'<div style="height:6px"></div>':`<nav class="tabs" aria-label="메뉴">${TABS[mode].map(([k,t])=>`<button data-act="nav" data-v="${k}" ${k===v?'aria-current="page"':''}>${t}</button>`).join('')}</nav>`}
  </div></header>
  <div class="wrap"><div class="notice"><span><b>시연용 화면</b> · 가명 데이터만 사용</span><span>역할 전환은 시연 기능이며 접근 권한 장치가 아니에요</span><span>기록은 이 브라우저에만 저장돼요</span></div>${alerts.join('')}</div>
  <main class="page wrap">${main}</main>`;
  paintSave();
}

/* ── 이벤트 ── */
function nodeClick(id){ui.node=id;render();}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-node]');if(g){nodeClick(g.dataset.node);return;}
  const el=e.target.closest('[data-act]');
  if(!el){if(ui.pop&&!e.target.closest('.pop')){ui.pop=false;render();}return;}
  const act=el.dataset.act;const c=cur();const p=c&&c.kind==='path'?c.obj:null;
  switch(act){
    case 'noop':return;
    case 'pick':{const th=state&&state.theme;if(ui.preset==='demo')demoState();else freshState();state.theme=th;state.picked=true;state.mode=el.dataset.m;ui.pdraft=null;save();break;}
    case 'mode':state.mode=el.dataset.m;ui.pop=false;ui.result=null;ui.editProfile=false;save();break;
    case 'nav':state.view[state.mode]=el.dataset.v;ui.result=null;ui.msg=null;ui.editProfile=false;save();window.scrollTo(0,0);break;
    case 'me':state.view.mentee='profile';ui.result=null;ui.editProfile=false;break;
    case 'theme':state.theme=isDark()?'light':'dark';document.documentElement.dataset.theme=state.theme;save();break;
    case 'pop':ui.pop=!ui.pop;break;
    case 'reset':ui.resetAsk=true;break;
    case 'reset-no':ui.resetAsk=false;break;
    case 'reset-yes':{const th=state.theme;freshState();state.theme=th;ui.resetAsk=false;corruptRaw=null;writesBlocked=tabConflict;resetQ();Object.assign(ui,{result:null,node:null,pdraft:null,editProfile:false,editSid:null,msg:null});save();break;}
    case 'raw':ui.showRaw=!ui.showRaw;break;
    case 'raw-replace':corruptRaw=null;writesBlocked=false;save();break;
    /* 프로필 */
    case 'goal-ex':ui.pdraft.goal=el.dataset.g;analyzeGoal();return;
    case 'goal-go':analyzeGoal();return;
    case 'pf-next':if(canSaveProfile(ui.pdraft)){state.profile=JSON.parse(JSON.stringify(ui.pdraft));state.profile.name=state.profile.name.trim();state.onboard='diag';ui.pdraft=null;save();window.scrollTo(0,0);}break;
    case 'pf-edit':ui.pdraft=JSON.parse(JSON.stringify(state.profile));ui.editProfile=true;ui.msg=null;window.scrollTo(0,0);break;
    case 'pf-cancel':ui.editProfile=false;ui.pdraft=null;ui.msg=null;break;
    case 'pf-save':if(canSaveProfile(ui.pdraft)){state.profile=JSON.parse(JSON.stringify(ui.pdraft));ui.editProfile=false;ui.pdraft=null;save();}break;
    case 'ob-back':state.onboard=el.dataset.to;ui.pdraft=null;save();break;
    case 'diag-start':startDiag(el.dataset.mode||'quick');window.scrollTo(0,0);break;
    case 'all-rounds':ui.allRounds=!ui.allRounds;break;
    case 'road-ai':if(state.onboard==='diag')state.onboard='roadmap';recommendRoadmap();return;
    case 'ob-finish':state.onboard='done';state.view.mentee='quiz';save();window.scrollTo(0,0);break;
    /* 온톨로지 */
    case 'onode':ui.node=el.dataset.n;break;
    case 'prio':{const why=(document.getElementById('prio-why')||{}).value||'';state.priority=el.dataset.n;state.priorityLog.push({at:nowISO(),what:`「${CONCEPTS[el.dataset.n].name}」 우선 지정`,why});save();break;}
    case 'prio-clear':state.priorityLog.push({at:nowISO(),what:`「${CONCEPTS[state.priority].name}」 우선 지정 해제`});state.priority=null;save();break;
    /* 퀴즈 */
    case 'start-run':startRun(+el.dataset.n);break;
    case 'resume-run':pauseActive();state.cursor={kind:'run',id:el.dataset.r};resetQ();save();break;
    case 'pause-run':{if(c){qtStop();c.obj.curMs=qt.acc;}state.cursor=null;resetQ();save();break;}
    case 'result':ui.result=el.dataset.r;ui.msg=null;window.scrollTo(0,0);break;
    case 'close-result':ui.result=null;break;
    case 'home':ui.result=null;ui.msg=null;break;
    case 'start-path':ui.msg=null;startPathById(el.dataset.p);window.scrollTo(0,0);break;
    case 'transfer-only':ui.msg=null;startTransferOnly(el.dataset.r,+el.dataset.i);break;
    case 'back-result':{if(c&&c.kind==='path'){qtStop();c.obj.curMs=qt.acc;if(c.obj.status==='active')c.obj.status='paused';}state.cursor=null;ui.result=el.dataset.r||null;resetQ();save();break;}
    case 'hint':ui.hint=true;break;
    case 'submit':submit(false);return;
    case 'abstain':submit(true);return;
    case 'next':if(p){nextInPath(p);p.updated=nowISO();resetQ();if(p.stage==='done'){state.cursor=null;ui.result=p.runId;}save(true);window.scrollTo(0,0);}break;
    case 'skip':if(p){qtStop();skipStage(p);resetQ();save(true);}break;
    case 'pend-found':if(p){goFoundation(p);resetQ();if(p.stage==='done'){state.cursor=null;ui.result=p.runId;}save(true);}break;
    case 'pend-sim':if(p){if(el.dataset.over)p.overrides.push('foundation');goSimilar(p);resetQ();if(p.stage==='done'){state.cursor=null;ui.result=p.runId;}save(true);}break;
    case 'pause':if(p){qtStop();p.curMs=qt.acc;p.status='paused';state.cursor=null;ui.result=p.runId;resetQ();save();}break;
    case 'askmentor':if(p){qtStop();p.mentorFlag=true;p.status='needs_mentor';p.helpReq=nowISO();state.cursor=null;ui.result=p.runId;resetQ();save(true);}break;
    /* 멘토 */
    case 'toggle-open':{const r=state.rounds[+el.dataset.n-1];r.open=!r.open;save();break;}
    case 'ev':state.view.mentor='analysis';ui.hl=el.dataset.a;render();document.getElementById('row-'+el.dataset.a)?.scrollIntoView({behavior:'smooth',block:'center'});return;
    case 'ai-lesson':runLessonAI();return;
    case 'ai-cancel':ui.aiCtrl?.abort();return;
    case 'dec':state.decisions.push({at:nowISO(),choice:el.dataset.v,why:(document.getElementById('dec-why')||{}).value||'',requestId:state.ai.lesson?.requestId});save();break;
    case 'sess-new':{const lastRun=state.runs.filter(r=>r.status==='done').slice(-1)[0];const s={id:nid('S'),date:todayKST(),attendance:'not_recorded',minutes:'',runId:lastRun?.id||'',memo:'',final:'',reviewed:false,revisions:[]};state.sessions.push(s);ui.editSid=s.id;save();break;}
    case 'sess-open':ui.editSid=el.dataset.s;ui.copyFallback=null;ui.msg=null;break;
    case 'draft-rule':{const s=state.sessions.find(x=>x.id===ui.editSid);s.final=ruleDraft(s);s.reviewed=false;s.draftSource='rule';save();break;}
    case 'draft-ai':runLogAI(ui.editSid);return;
    case 'confirm':{const s=state.sessions.find(x=>x.id===ui.editSid);const n=s.revisions.filter(r=>r.rev).length+1;
      s.revisions.push({rev:n,status:'confirmed',at:nowISO(),minutes:+s.minutes,text:s.final.trim()});s.reviewed=false;ui.msg=`${s.date} 회기를 ${n}판으로 확정했어요.`;ui.month=s.date.slice(0,7);save();break;}
    case 'withdraw':{const s=state.sessions.find(x=>x.id===ui.editSid);const why=(document.getElementById('wd-why')||{}).value||'';
      if(!why.trim()){ui.msg='철회 이유를 입력해 주세요.';break;}s.revisions.push({status:'withdrawn',at:nowISO(),reason:why});ui.msg=`${s.date} 회기 확정을 철회했어요. 대장 합산에서 빠집니다.`;save();break;}
    case 'copy':{const led=state.sessions.filter(s=>s.date.slice(0,7)===ui.month&&counted(s)).sort((a,b)=>a.date<b.date?-1:1);
      const tsv=['날짜\t멘티\t활동 시간(분)\t활동 내용',...led.map(s=>{const r=latestRev(s);return `${s.date}\t${LN()}(가명)\t${r.minutes}\t${r.text.replace(/\s+/g,' ')}`;}),`합계\t\t${led.reduce((n,s)=>n+latestRev(s).minutes,0)}\t`].join('\n');
      try{navigator.clipboard.writeText(tsv).then(()=>{ui.copyFallback=null;ui.msg='대장 표를 복사했어요. 한글·엑셀에 붙여 넣을 수 있어요.';render();},()=>{ui.copyFallback=tsv;render();});}catch(err){ui.copyFallback=tsv;}break;}
  }
  render();
});
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('[data-node]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nodeClick(g.dataset.node);setTimeout(()=>document.querySelector(`[data-node="${g.dataset.node}"]`)?.focus(),0);return;}
  if(e.key==='Enter'&&e.target.id==='p-goal'){e.preventDefault();analyzeGoal();return;}
  if(e.key==='Escape'&&ui.pop){ui.pop=false;render();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.preset!=null){ui.preset=t.value;return;}
  if(t.dataset.sel!=null){ui.sel=+t.dataset.sel;const b=document.getElementById('submit-btn');if(b)b.disabled=false;return;}
  if(t.dataset.helped!=null){ui.helped=t.checked;return;}
  if(t.dataset.rel){ui.rels[t.dataset.rel]=t.checked;render();return;}
  if(t.dataset.pf&&ui.pdraft){ui.pdraft[t.dataset.pf]=t.dataset.pf==='age'?(t.value===''?'':Math.round(+t.value)):t.value;render();return;}
  if(t.dataset.month!=null){ui.month=t.value;ui.copyFallback=null;render();return;}
  if(t.dataset.sf){const s=state.sessions.find(x=>x.id===ui.editSid);if(!s)return;const f=t.dataset.sf;
    s[f]=t.type==='checkbox'?t.checked:(f==='minutes'?(t.value===''?'':Math.round(+t.value)):t.value);
    if(f!=='reviewed')s.reviewed=false;save(f==='memo');render();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf&&ui.pdraft&&t.type==='text'){ui.pdraft[t.dataset.pf]=t.value;
    const b=document.querySelector('[data-act="pf-next"],[data-act="pf-save"]');if(b)b.disabled=!canSaveProfile(ui.pdraft);return;}
  if(t.dataset.sf==='memo'||t.dataset.sf==='final'){const s=state.sessions.find(x=>x.id===ui.editSid);s[t.dataset.sf]=t.value;debounceSave();}
});
function debounceSave(){saveStatus='pending';paintSave();clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),600);}

load();
if(state.theme)document.documentElement.dataset.theme=state.theme;
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!state.theme)render();});
render();
})();
</script>

</body></html>
